# Optional front-proxy cache. Include inside the Friendica virtual host only.
# Requires mod_cache, mod_cache_disk and mod_setenvif. See the performance guide.
# The origin must run the matching ActivityPubObjectCache policy with a positive TTL.
CacheRoot /var/cache/apache2/friendica-objects
CacheQuickHandler Off
CacheDefaultExpire 0
CacheLastModifiedFactor 0
CacheMaxExpire 60
CacheStaleOnError Off
CacheStorePrivate Off
CacheStoreNoStore Off
CacheStoreExpired Off
CacheIgnoreCacheControl Off
CacheIgnoreQueryString Off
CacheMaxFileSize 262144

# Do not serve stale content while another request refreshes a changed object.
CacheLock Off

# Bypass lookup as well as storage, including after an anonymous cache has warmed.
SetEnvIfExpr "%{REQUEST_METHOD} !~ m#^(GET|HEAD)$# || -n req('Authorization') || -n req('Cookie') || -n req('Signature') || -n req('Signature-Input') || -n %{QUERY_STRING}" no-cache=1

# Profiles, collections, activities, inboxes and API routes are outside this cache.
<LocationMatch "^/objects/[^/]+$">
    CacheEnable disk
</LocationMatch>
